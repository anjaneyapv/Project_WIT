<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANPAV Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(#011a2b, #033b46);
      color: white;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #002634;
      padding: 10px 20px;
      border-bottom: 2px solid #00bcd4;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .logo {
      height: 40px;
      margin-right: 10px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    .username {
      font-style: italic;
      font-size: 14px;
      text-align: center;
    }

    nav {
      position: relative;
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: 2px solid #00bcd4;
      padding: 5px 10px;
      border-radius: 5px;
      background: rgba(0, 188, 212, 0.2);
      transition: background 0.3s ease;
    }

    nav a:hover {
      background: #00bcd4;
      color: #000;
    }

    .hamburger {
      display: none;
      font-size: 26px;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
    }

    .adsense {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      margin: 20px 0;
      color: #fff;
      border-top: 2px dashed #fff;
      border-bottom: 2px dashed #fff;
      padding: 10px;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #00bcd4;
      border-radius: 10px;
      padding: 10px;
      width: fit-content;
      box-shadow: 2px 2px 10px #00bcd4;
      color: white;
      text-decoration: none;
      transition: background 0.3s;
    }

    .card:hover {
      background: rgba(0, 188, 212, 0.2);
    }

    .card img {
      height: 80px;
      width: 80px;
      margin-right: 15px;
    }

    .card span {
      font-size: 20px;
      font-weight: bold;
    }

    .info-panel {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    .info-panel img {
      max-width: 100%;
      border-radius: 10px;
      border: 2px solid #00bcd4;
    }

    /* Responsive Design */
    @media screen and (min-width: 768px) {
      h1 {
        font-size: 36px;
      }

      .logo {
        height: 60px;
      }

      .username {
        font-size: 18px;
      }

      .main-content {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
      }

      .cards {
        gap: 30px;
      }

      .card {
        padding: 15px 20px;
      }

      .card img {
        height: 100px;
        width: 100px;
      }

      .card span {
        font-size: 26px;
      }

      .info-panel {
        margin-top: 0;
        margin-left: 40px;
        max-width: 50%;
      }
    }

    @media screen and (max-width: 767px) {
      nav ul {
        flex-direction: column;
        background: #002634;
        position: absolute;
        top: 60px;
        right: 20px;
        width: 150px;
        display: none;
        border: 1px solid #00bcd4;
        border-radius: 5px;
        padding: 10px;
      }

      nav ul.show {
        display: flex;
      }

      .hamburger {
        display: block;
      }

      .info-panel {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="ANPAV Logo" class="logo">
      <h1>ANPAV</h1>
    </div>
    <p class="username">Hi *username*</p>
    <nav>
      <button class="hamburger" onclick="toggleMenu()">☰</button>
      <ul id="menuList">
        <li><a href="#">Course</a></li>
        <li><a href="#">Result</a></li>
        <li><a href="#">Updates</a></li>
      </ul>
    </nav>
  </header>

  <section class="adsense">ADSENSE</section>

  <div class="main-content">
    <section class="cards">
      <a href="cse.html" class="card">
        <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="CSE QR">
        <span>CSE</span>
      </a>
      <a href="ec.html" class="card">
        <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="E&C QR">
        <span>E&C</span>
      </a>
      <a href="eee.html" class="card">
        <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="EEE QR">
        <span>EEE</span>
      </a>
      <a href="mec.html" class="card">
        <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="MEC QR">
        <span>MEC</span>
      </a>
      <a href="cvl.html" class="card">
        <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="CVL QR">
        <span>CVL</span>
      </a>
    </section>

    <section class="info-panel">
      <img src="https://www.datanami.com/wp-content/uploads/2023/02/ChatGPT_shutterstock_CKA-scaled.jpg" alt="Result Details">
    </section>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('menuList');
      menu.classList.toggle('show');
    }
  </script>
</body>
</html>
